name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Smoke import + benchmark
        run: |
          python -c "import app.main; print('app imports OK')"
          python benchmark.py
      - name: Tests
        run: pytest -q
